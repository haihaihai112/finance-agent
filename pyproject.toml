[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agent-project"
version = "1.0.0"
description = "金融多智能体个人项目：业务确认、文档OCR、MCP与真实来源数据"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1",
    "httpx>=0.27,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2,<3", "pymysql>=1.1,<2", "cryptography>=44",
    "langgraph>=1,<2", "mcp>=1.30,<2", "rapidocr>=3.10,<4",
    "onnxruntime>=1.20,<2", "pymupdf>=1.26,<2", "pillow>=11,<13",
    "requests>=2.32,<3", "beautifulsoup4>=4.13,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finance_agents.data_jobs" = ["verified_market_snapshot.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
